name: Deploy staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

# Build and deploy the native host to Cloud Run (persistent World).
# Job is skipped until WIF variables exist; CI remains the green/red signal.
jobs:
  deploy:
    name: Cloud Run (staging)
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy terrarium-staging
        run: |
          gcloud run deploy terrarium-staging \
            --project=terrarium-506917 \
            --region=us-central1 \
            --source=. \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=1 \
            --memory=128Mi \
            --cpu=1 \
            --no-cpu-throttling \
            --timeout=3600 \
            --set-env-vars=TERRARIUM_ENV=staging,SKIN_DIR=/skin \
            --quiet
