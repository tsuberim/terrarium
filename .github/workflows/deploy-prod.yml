name: Deploy production

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

# Build and deploy the native host to Cloud Run prod (persistent World).
jobs:
  deploy:
    name: Cloud Run (prod)
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy terrarium-prod
        run: |
          gcloud run deploy terrarium-prod \
            --project=terrarium-506917 \
            --region=us-central1 \
            --source=. \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=1 \
            --memory=128Mi \
            --cpu=1 \
            --no-cpu-throttling \
            --timeout=3600 \
            --set-env-vars=TERRARIUM_ENV=prod,SKIN_DIR=/skin \
            --quiet
