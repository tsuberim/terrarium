name: Deploy production

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

# Copy static skin to the public prod GCS bucket. No Docker, no Cloud Run.
jobs:
  deploy:
    name: gcloud storage cp (prod)
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          audience: https://github.com/tsuberim/terrarium
      - uses: google-github-actions/setup-gcloud@v2
      - name: Copy skin to gs://terrarium-506917-prod
        run: |
          gcloud storage cp \
            apps/skin/index.html \
            apps/skin/styles.css \
            apps/skin/main.js \
            gs://terrarium-506917-prod/ \
            --cache-control="public, max-age=60" \
            --project=terrarium-506917

  notify:
    name: slack (#deploys)
    needs: [deploy]
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post prod deploy result
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_DEPLOYS }}
          text: |
            ${{ needs.deploy.result == 'success' && format(':white_check_mark: Production is live — `{0}`.', github.ref_name) || format(':x: Production deploy failed — `{0}`.', github.ref_name) }}
            https://storage.googleapis.com/terrarium-506917-prod/index.html
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>
