name: CI

# PRs only — push to main is covered by deploy.yml (test + optional prod deploy).
on:
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "strategies/**"
      - "services/**"
      - "sdk/**"
      - "scripts/**"
      - "firebase.json"
      - ".github/workflows/**"

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml
    permissions:
      contents: read
      actions: write
