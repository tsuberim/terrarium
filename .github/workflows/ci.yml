name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test kernel
        run: cargo test --manifest-path crates/kernel/Cargo.toml

  docs:
    name: required docs exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs
        run: |
          set -e
          for f in \
            README.md \
            docs/README.md \
            docs/vision.md \
            docs/architecture.md \
            docs/environments.md \
            docs/secrets.md \
            docs/journey.md \
            docs/current-state.md
          do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

  notify-failure:
    name: slack (#ci)
    needs: [kernel, docs]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post failure to #ci
        uses: ./.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: C0BT9UDTQJX
          text: |
            :x: *CI failed* — ${{ github.workflow }}
            ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('`{0}`', github.ref_name) }} · ${{ github.sha }}
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>
