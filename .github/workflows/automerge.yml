# Enable squash auto-merge on every non-draft PR when required checks pass.

name: Automerge

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            try {
              await github.rest.pulls.enableAutoMerge({
                owner,
                repo,
                pull_number,
                merge_method: 'squash',
              });
              core.info(`Auto-merge enabled for PR #${pull_number}`);
            } catch (error) {
              // Already enabled or checks not configured yet — ignore.
              core.info(error.message);
            }
