name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'services/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'strategies/**'
            frontend:
              - 'apps/**'
              - 'docs/internal/qa/**'
              - 'scripts/qa*.sh'
              - 'scripts/ci-e2e.sh'
              - 'scripts/generate-config.sh'
              - 'firebase.json'
            docker:
              - 'Dockerfile'
            workflows:
              - '.github/workflows/**'

  rust:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
        run: cargo fmt --all -- --check
      - if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
        run: cargo test --workspace
      - if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
        run: cargo build --release -p terrarium-server
      - if: needs.changes.outputs.rust != 'true' && needs.changes.outputs.workflows != 'true'
        run: echo "No rust changes — skipped"

  frontend:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/skin/package-lock.json
      - if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
        run: npm ci && npm run lint && npm run build
        working-directory: apps/skin
        env:
          VITE_API_BASE: ""
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-project
          VITE_FIREBASE_APP_ID: ci-app
      - if: needs.changes.outputs.frontend != 'true' && needs.changes.outputs.workflows != 'true'
        run: echo "No frontend changes — skipped"

  docker:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true'
        uses: docker/setup-buildx-action@v4
      - if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: terrarium-server
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: needs.changes.outputs.docker != 'true' && needs.changes.outputs.workflows != 'true'
        run: echo "Dockerfile unchanged — skipped"

  e2e:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/skin/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x scripts/*.sh && ./scripts/ci-e2e.sh

  gate:
    needs: [changes, rust, frontend, docker, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.rust.result }}" = "failure" ] || \
             [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.docker.result }}" = "failure" ] || \
             [ "${{ needs.e2e.result }}" = "failure" ]; then
            echo "A required test job failed"
            exit 1
          fi
          echo "CI gate passed (skipped jobs OK)"
