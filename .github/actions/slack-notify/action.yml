name: Slack notify
description: Post a message to Slack via chat.postMessage (Remy bot)

inputs:
  token:
    description: Slack bot token (empty skips the post)
    required: false
    default: ""
  channel:
    description: Slack channel ID or name
    required: true
  text:
    description: Message text (Slack mrkdwn)
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.token }}
        SLACK_CHANNEL: ${{ inputs.channel }}
        TEXT: ${{ inputs.text }}
      run: |
        set -euo pipefail
        if [ -z "$SLACK_BOT_TOKEN" ]; then
          echo "No bot token configured; skipping Slack notify."
          exit 0
        fi
        payload="$(jq -n --arg channel "$SLACK_CHANNEL" --arg text "$TEXT" '{channel: $channel, text: $text}')"
        response="$(curl -sf -X POST \
          -H 'Authorization: Bearer '"$SLACK_BOT_TOKEN" \
          -H 'Content-type: application/json; charset=utf-8' \
          -d "$payload" \
          'https://slack.com/api/chat.postMessage')"
        ok="$(echo "$response" | jq -r '.ok')"
        if [ "$ok" != "true" ]; then
          echo "Slack chat.postMessage failed:"
          echo "$response" | jq '{ok, error, warning}'
          exit 1
        fi
