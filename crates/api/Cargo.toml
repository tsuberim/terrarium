[package]
name = "terrarium-api"
version = "0.1.0"
edition = "2021"
description = "Terrarium API: credits ledger, API tokens, public spawn."
repository = "https://github.com/tsuberim/terrarium"
license = "UNLICENSED"
publish = false

[[bin]]
name = "terrarium-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
rand = "0.8"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
jsonwebtoken = "=7.2.0"
attohttpc = { version = "0.28", default-features = false, features = ["json", "rustls"] }
terrarium-kernel = { path = "../kernel" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "=1.11.0", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
