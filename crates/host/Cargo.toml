[package]
name = "terrarium-host"
version = "0.1.0"
edition = "2021"
description = "Native Terrarium host: owns World, ticks continuously, serves skin + WebSocket."
repository = "https://github.com/tsuberim/terrarium"
license = "UNLICENSED"
publish = false

[[bin]]
name = "terrarium-host"
path = "src/main.rs"

[dependencies]
terrarium-kernel = { path = "../kernel" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
