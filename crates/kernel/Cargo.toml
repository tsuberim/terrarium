[package]
name = "terrarium-kernel"
version = "0.1.0"
edition = "2021"
description = "Terrarium world kernel: closed-box mass, fixed-point physics, bytecode guests, conservation load-bearing."
repository = "https://github.com/tsuberim/terrarium"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "=0.2.100", optional = true }
