id: deploy-creature
description: Compile creature, pick map cell, deploy with minimum glims
requires:
  - auth_emulator
  - compile_worker
  - api
steps:
  - assert:
      e2eState:
        signedIn: true
        studioOpen: true
  - click: e2e-studio-run-all
  - waitFor:
      e2eState:
        testing: false
        wasmReady: true
        allTestsPassed: true
      timeout: 60000
  - note: Pick deploy cell on map BEFORE opening deploy dialog (modal blocks mis-aimed clicks)
  - clickMap: {}
  - assert:
      e2eState:
        deployCell: not_null
  - note: Faucet if credits below deploy cost (110 glims typical)
  - faucet: true
  - click: e2e-studio-deploy
  - assert:
      e2eState:
        deployDialogOpen: true
  - click: e2e-deploy-confirm
  - waitFor:
      e2eState:
        deployDialogOpen: false
      timeout: 15000
