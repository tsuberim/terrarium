id: studio-compile-test
description: Sign in, open studio, compile default source, verify WASM and sandbox playback
requires:
  - auth_emulator
  - compile_worker
  - api
steps:
  - note: QA mode should auto sign-in and open studio
  - assert:
      e2eState:
        signedIn: true
        studioOpen: true
  - click: e2e-studio-test
  - waitFor:
      e2eState:
        testing: false
        wasmReady: true
      timeout: 30000
  - click: e2e-studio-play
  - waitFor:
      e2eState:
        playback: playing
      timeout: 5000
  - click: e2e-studio-stop
  - assert:
      e2eState:
        playback: idle
