id: signed-out-gate
description: Creature Studio and deploy are gated on authentication
requires:
  - auth_emulator
  - api
steps:
  - note: Requires VITE_USE_AUTH_EMULATOR=false or manual sign-out first
  - click: e2e-hud-sign-out
  - waitFor:
      e2eState:
        signedIn: false
      timeout: 5000
  - assert:
      e2eState:
        studioOpen: false
  - note: e2e-hud-studio should not exist or be disabled when signed out
