<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="terrarium — a closed box of matter. write a program. stay alive.">
  <meta name="terrarium-env" content="staging">
  <title>terrarium</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="world" width="480" height="480" aria-label="terrarium world"></canvas>
  <div class="crt" aria-hidden="true"></div>

  <header class="chrome">
    <a class="wordmark" href="./">terrarium</a>
    <span id="env-badge" class="env-badge">staging</span>
    <button type="button" id="btn-toggle-console" class="toggle" aria-expanded="false" aria-controls="console">
      program
    </button>
  </header>

  <aside id="console" class="console" aria-label="program editor" hidden>
    <div class="console-head">
      <label for="cell-select">cell</label>
      <select id="cell-select"></select>
      <button type="button" id="btn-close-console" class="icon-close" aria-label="close program">×</button>
    </div>

    <div class="demos" role="group" aria-label="demo programs">
      <button type="button" data-demo="wander">wander</button>
      <button type="button" data-demo="chase">chase</button>
      <button type="button" data-demo="sit">sit</button>
    </div>

    <label class="sr-only" for="program">program</label>
    <textarea id="program" spellcheck="false" rows="12" placeholder="thrust 40 20&#10;sleep&#10;jump 0"></textarea>

    <div class="actions">
      <button type="button" id="btn-run" class="primary">Run</button>
      <button type="button" id="btn-reset">Reset</button>
    </div>

    <p id="status" class="status" role="status"></p>

    <details class="cheatsheet">
      <summary>verbs</summary>
      <pre>thrust fx fy       burn mass, push
thrust_toward mag  chase last sense hit
sense              look (burns)
absorb             take nearest inert
dump amount        leave inert mass
sleep              free; end this tick
jump / jnz / jz    control flow
halt</pre>
    </details>
  </aside>

  <script type="module" src="main.js"></script>
</body>
</html>
